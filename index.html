<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 Git 练习仓库</title>
<style>
  body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f2f4f7;color:#24292f;line-height:1.8;}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px;}
  .card{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  h1{margin:0;font-size:24px;color:#2e7d32;}
  .sub{color:#57606a;font-size:14px;margin:4px 0 0;}
  h2{font-size:16px;margin:0 0 8px;color:#24292f;}
  pre{background:#f6f8fa;border-radius:8px;padding:12px 16px;font-size:14px;overflow-x:auto;margin:0;}
  .commit{font-family:Consolas,monospace;font-size:13px;color:#57606a;padding:4px 0;border-bottom:1px dashed #eaeef2;}
  .commit:last-child{border-bottom:none;}
  footer{text-align:center;color:#8c959f;font-size:13px;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>我的 Git 练习仓库</h1>
    <p class="sub">账号 ak47666wei · 仓库 asfa · 由 Git 推送到 GitHub Pages</p>
  </div>
  <div class="card">
    <h2>📝 我的学习笔记</h2>
    <pre>我的 Git 练习仓库
第1行：学会 add/commit
第2行：学会 merge/rebase
第3行：今天学会了push</pre>
  </div>
  <div class="card">
    <h2>🕒 提交历史（Git 存档记录）</h2>
    <div class="commit">e1fd6db 练习：添加一行笔记</div>
    <div class="commit">400f354 合并云端与本地</div>
    <div class="commit">f8133ad 仓库原有提交</div>
    <div class="commit">008b493 初始化练习仓库</div>
  </div>
  <footer>用 Git 学的第一课：改 → 存 → 传</footer>
</div>
</body>
</html>
